version: "3.8"

services:
  frontend:
    container_name: "frontend-container"
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
      args:
        NODE_ENV: production
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app_net
    depends_on:
      - http-backend
      - ws-backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  http-backend:
    container_name: "http-backend-container"
    build:
      context: .
      dockerfile: ./apps/http-backend/Dockerfile
      args:
        NODE_ENV: production
    restart: unless-stopped
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  ws-backend:
    container_name: "ws-backend-container"
    build:
      context: .
      dockerfile: ./apps/ws-backend/Dockerfile
      args:
        NODE_ENV: production
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  
networks:
  app_net:
    driver: bridge