apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncpad-ws-backend-deployment
  namespace: syncpad
  labels:
    app: syncpad-ws-backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: syncpad-ws-backend
  template:
    metadata:
      labels:
        app: syncpad-ws-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: syncpad-ws-backend-container 
          image: debjyoti08/syncpad_ws_backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4002
          envFrom:
            - secretRef:
                name: syncpad-secret
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"