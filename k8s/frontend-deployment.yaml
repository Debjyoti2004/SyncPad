apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncpad-frontend-deployment
  namespace: syncpad
  labels:
    app: syncpad-frontend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: syncpad-frontend
  template:
    metadata:
      labels:
        app: syncpad-frontend
    spec:
      containers:
        - name: syncpad-frontend
          image: debjyoti08/syncpad_frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      restartPolicy: Always