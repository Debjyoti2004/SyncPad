apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncpad-http-backend-deployment
  namespace: syncpad
  labels:
    app: syncpad-http-backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: syncpad-http-backend
  template:
    metadata:
      labels:
        app: syncpad-http-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: syncpad-http-backend-container 
          image: debjyoti08/syncpad_http_backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
          envFrom:
            - secretRef:
                name: syncpad-secret
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /status
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /status
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 10
